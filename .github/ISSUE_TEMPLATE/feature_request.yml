name: Feature request
description: Propose a reusable product capability
title: "feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What cannot be done with the existing scenario, provider, voice, or verification contracts?
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Observable result
      description: What result would prove the capability works?
    validations:
      required: true
  - type: textarea
    id: reuse
    attributes:
      label: Existing mechanism considered
      description: Name the reusable primitive you checked before proposing a new one.
    validations:
      required: true
