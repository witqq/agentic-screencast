name: GitHub Release

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated tag, for example v1.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and create immutable release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out release tag and complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reject private historical captures
        run: node scripts/check-public-history.mjs

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install chromium

      - name: Verify tag and package version
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          test "${RELEASE_TAG}" = "v${version}"
          git cat-file -e "${RELEASE_TAG}^{tag}"

      - name: Run product gate
        run: npm test

      - name: Build and verify release candidate
        run: npm run pack:check -- --output agent_temp_files_local/release-candidate

      - name: Build and verify landing
        run: npm run site:check

      - name: Verify public Moira workflow contracts
        run: npm run workflow:check

      - name: Refuse to replace an existing release
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "release ${RELEASE_TAG} already exists; immutable releases are never replaced" >&2
            exit 1
          fi

      - name: Create GitHub Release from the accepted candidate
        run: |
          set -euo pipefail
          record="agent_temp_files_local/release-candidate/candidate-evidence.json"
          asset="$(node -e 'const fs=require("node:fs");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(r.tarball.path)' "${record}")"
          version="$(node -p "require('./package.json').version")"
          gh release create "${RELEASE_TAG}" "${asset}" \
            --verify-tag \
            --generate-notes \
            --notes "[Made with Moira](https://moira-mcp.com/)" \
            --title "agentic-screencast ${version}"

      - name: Report accepted asset identity
        run: node -e 'const r=require("./agent_temp_files_local/release-candidate/candidate-evidence.json");console.log(JSON.stringify(r.tarball))'
