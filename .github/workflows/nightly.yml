name: Nightly browser and end-to-end checks

on:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Browser and end-to-end product gate
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install chromium

      - name: Run the nightly gate
        run: |
          set -euo pipefail
          mkdir -p test-results
          npm run nightly:verify 2>&1 | tee test-results/nightly.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-results-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
